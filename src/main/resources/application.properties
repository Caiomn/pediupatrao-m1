# Porta local: pode ser substitu\u00edda pela vari\u00e1vel PORT.
server.port=${PORT:3001}

# Use MONGODB_URI para conectar ao Atlas ou a outro servidor MongoDB.
# Sem a vari\u00e1vel, usa o MongoDB local padr\u00e3o.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
spring.data.mongodb.database=pizzaria
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
#spring.main.allow-circular-references=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG
