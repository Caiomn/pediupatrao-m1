<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Pedidos</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Pedidos</h2>
        <a class="btn btn-primary" th:href="@{/pedidos/novo}">Novo pedido</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>ID</th><th>Cliente</th><th>Itens</th><th>Entrada</th>
                <th>Status</th><th>Total</th><th>Ações</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="7">Nenhum pedido.</td></tr>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${pedido.id}"></td>
                <td th:text="${pedido.clienteId}"></td>
                <td><span th:each="item,iter : ${pedido.itens}">
                    <span th:text="${item.qtde + ' x ' + item.produto}"></span>
                    <span th:if="${!iter.last}">, </span>
                </span></td>
                <td th:text="${pedido.dataHoraEntrada}"></td>
                <td th:text="${pedido.status}"></td>
                <td th:text="${'R$ ' + pedido.valorTotal}"></td>
                <td>
                    <form sec:authorize="hasAnyRole('ADMIN', 'GERENTE', 'ATENDENTE')"
                          th:if="${pedido.status.name() == 'RECEBIDO'}"
                          th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                        <input type="hidden" name="status" value="EM_PREPARACAO">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Iniciar preparo</button>
                    </form>
                    <form sec:authorize="hasAnyRole('ADMIN', 'GERENTE', 'ATENDENTE')"
                          th:if="${pedido.status.name() == 'EM_PREPARACAO'}"
                          th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                        <input type="hidden" name="status" value="PRONTO">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Marcar pronto</button>
                    </form>
                    <form sec:authorize="hasAnyRole('ADMIN', 'GERENTE', 'ATENDENTE')"
                          th:if="${pedido.status.name() == 'PRONTO'}"
                          th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                        <input type="hidden" name="status" value="SAIU_PARA_ENTREGA">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Saiu para entrega</button>
                    </form>
                    <form sec:authorize="hasAnyRole('ADMIN', 'GERENTE', 'ATENDENTE')"
                          th:if="${pedido.status.name() == 'SAIU_PARA_ENTREGA'}"
                          th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                        <input type="hidden" name="status" value="FINALIZADO">
                        <button class="btn btn-sm btn-outline-success" type="submit">Finalizar</button>
                    </form>
                    <span sec:authorize="hasRole('GERENTE')">
                        <form th:if="${pedido.status.name() != 'CANCELADO' and pedido.status.name() != 'FINALIZADO'}"
                              th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="d-inline">
                            <input name="justificativa" required placeholder="Justificativa"
                                   aria-label="Justificativa do cancelamento">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                        </form>
                        <form th:if="${pedido.status.name() != 'CANCELADO' and pedido.status.name() != 'FINALIZADO'
                                      and pedido.status.name() != 'SAIU_PARA_ENTREGA'}"
                              th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="d-inline">
                            <input type="number" name="percentual" min="0.01" max="20" step="0.01"
                                   required placeholder="% desconto" aria-label="Percentual de desconto">
                            <button class="btn btn-sm btn-outline-warning" type="submit">Aplicar desconto</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
